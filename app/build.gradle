plugins {
    id 'com.android.application'
}

android {
    namespace 'com.master.radiomaroc'
    compileSdk 35

    defaultConfig {
        applicationId "com.master.radiomaroc"
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName "3.0"
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }
}
