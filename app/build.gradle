plugins {
    id 'com.android.application'
}

def releaseKeystore = System.getenv('RADIO_MAROC_KEYSTORE_FILE')
def releasePassword = System.getenv('RADIO_MAROC_KEYSTORE_PASSWORD')

android {
    namespace 'com.master.radiomaroc'
    compileSdk 35

    defaultConfig {
        applicationId "com.master.radiomaroc"
        minSdk 24
        targetSdk 35
        versionCode 14
        versionName "5.1"
    }

    signingConfigs {
        release {
            if (releaseKeystore && releasePassword) {
                storeFile file(releaseKeystore)
                storePassword releasePassword
                keyAlias 'radiomaroc'
                keyPassword releasePassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseKeystore && releasePassword) {
                signingConfig signingConfigs.release
            }
        }
    }
}
