name: Build Signed RadioMaroc Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RADIO_MAROC_KEYSTORE_PASSWORD: ${{ secrets.RADIO_MAROC_KEYSTORE_PASSWORD }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore private signing key
        env:
          KEYSTORE_B64: ${{ secrets.RADIO_MAROC_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$RADIO_MAROC_KEYSTORE_PASSWORD"
          echo "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/radiomaroc-release.jks"
          chmod 600 "$GITHUB_WORKSPACE/radiomaroc-release.jks"

      - name: Build signed release APK
        env:
          RADIO_MAROC_KEYSTORE_FILE: ${{ github.workspace }}/radiomaroc-release.jks
        run: gradle assembleRelease --stacktrace

      - name: Verify release signature and fingerprint
        run: |
          apksigner verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk > app/build/outputs/apk/release/SHA256SUMS.txt

      - name: Remove private signing key
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/radiomaroc-release.jks"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: RadioMaroc-Signed-Release-APK
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error
