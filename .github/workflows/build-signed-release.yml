name: Build Signed RadioMaroc Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RADIO_MAROC_KEYSTORE_PASSWORD: ${{ secrets.RADIO_MAROC_KEYSTORE_PASSWORD }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 36 SDK
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore private signing key
        env:
          KEYSTORE_B64: ${{ secrets.RADIO_MAROC_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$RADIO_MAROC_KEYSTORE_PASSWORD"
          echo "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/radiomaroc-release.jks"
          chmod 600 "$GITHUB_WORKSPACE/radiomaroc-release.jks"

      - name: Build signed release APK and AAB
        env:
          RADIO_MAROC_KEYSTORE_FILE: ${{ github.workspace }}/radiomaroc-release.jks
        run: gradle assembleRelease bundleRelease --stacktrace

      - name: Verify release signature and fingerprint
        run: |
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk app/build/outputs/bundle/release/app-release.aab > app/build/outputs/apk/release/SHA256SUMS.txt

      - name: Remove private signing key
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/radiomaroc-release.jks"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: RadioMaroc-Google-Play-Release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
