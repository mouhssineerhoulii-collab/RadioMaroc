name: Validate RadioMaroc Live Streams

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test published station endpoints
        shell: bash
        run: |
          python3 - <<'PY' > /tmp/stream_urls.txt
          import re
          from pathlib import Path
          text = Path('app/src/main/java/com/master/radiomaroc/Stations.java').read_text()
          urls = []
          for line in text.splitlines():
              if 's(' not in line:
                  continue
              for url in re.findall(r'"(https?://[^" ]+)"', line):
                  if 'haca.ma/' not in url and url not in urls:
                      urls.append(url)
          print('\n'.join(urls))
          PY
          check_stream() {
            url="$1" headers=$(mktemp)
            bytes=$(curl --location --range 0-2047 --connect-timeout 10 --max-time 15 --silent --show-error --dump-header "$headers" "$url" 2>/dev/null | head -c 2048 | wc -c || true)
            code=$(awk '/^HTTP/{c=$2} END{print c+0}' "$headers")
            type=$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{t=$2} END{gsub("\\r", "", t); print t}' "$headers")
            rm -f "$headers"
            state=FAILED; [ "$bytes" -gt 0 ] && state=RECEIVING
            printf '%s\t%s\t%s\t%s bytes\t%s\n' "$state" "$code" "$type" "$bytes" "$url"
          }
          export -f check_stream
          xargs -r -n 1 -P 12 bash -c 'check_stream "$0"' < /tmp/stream_urls.txt | sort > /tmp/stream_report.txt
          echo '--- endpoint report ---'
          cat /tmp/stream_report.txt
      - name: Upload stream validation report
        uses: actions/upload-artifact@v4
        with:
          name: RadioMaroc-Stream-Validation
          path: /tmp/stream_report.txt
