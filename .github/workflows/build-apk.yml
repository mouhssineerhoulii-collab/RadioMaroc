name: Build RadioMaroc APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Generate debug SHA-256
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Restore release signing key
        if: ${{ secrets.RADIO_MAROC_KEYSTORE_B64 != '' && secrets.RADIO_MAROC_KEYSTORE_PASSWORD != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.RADIO_MAROC_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/radiomaroc-release.jks"
          chmod 600 "$GITHUB_WORKSPACE/radiomaroc-release.jks"

      - name: Build signed release APK
        if: ${{ secrets.RADIO_MAROC_KEYSTORE_B64 != '' && secrets.RADIO_MAROC_KEYSTORE_PASSWORD != '' }}
        env:
          RADIO_MAROC_KEYSTORE_FILE: ${{ github.workspace }}/radiomaroc-release.jks
          RADIO_MAROC_KEYSTORE_PASSWORD: ${{ secrets.RADIO_MAROC_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Verify release signature
        if: ${{ secrets.RADIO_MAROC_KEYSTORE_B64 != '' && secrets.RADIO_MAROC_KEYSTORE_PASSWORD != '' }}
        run: |
          apksigner verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk > app/build/outputs/apk/release/SHA256SUMS.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RadioMaroc-Debug-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload signed release APK
        if: ${{ secrets.RADIO_MAROC_KEYSTORE_B64 != '' && secrets.RADIO_MAROC_KEYSTORE_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: RadioMaroc-Signed-Release-APK
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error
